<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate</title>

<style>
@page {
    size: A4;
    margin: 0;
}

body {
    width: 210mm;
    height: 297mm;
    margin: 0;
    padding: 0;
    font-family: "Georgia", serif;
    background: linear-gradient(135deg, #fdfcfb, #e2d1c3);
}

.certificate {
    position: relative;
    width: 100%;
    height: 100%;
    border: 18px solid #1e3c72;
    box-sizing: border-box;
    padding: 50px;
}

.inner-border {
    width: 100%;
    height: 100%;
    border: 6px solid #d4af37;
    padding: 40px;
    box-sizing: border-box;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    color: #1e3c72;
    letter-spacing: 2px;
}

.subtitle {
    font-size: 16px;
    color: #555;
    margin-top: 5px;
}

.title {
    margin-top: 35px;
    font-size: 40px;
    color: #b8860b;
    font-weight: bold;
    text-transform: uppercase;
}

.presented {
    margin-top: 25px;
    font-size: 18px;
    color: #333;
}

.name {
    margin-top: 20px;
    font-size: 44px;
    font-weight: bold;
    color: #1e3c72;
    border-bottom: 2px solid #1e3c72;
    display: inline-block;
    padding: 5px 20px;
}

.details {
    margin-top: 25px;
    font-size: 18px;
    color: #333;
    line-height: 1.6;
}

.event {
    margin-top: 15px;
    font-size: 26px;
    font-weight: bold;
    color: #8b4513;
}

.footer {
    position: absolute;
    bottom: 70px;
    left: 60px;
    right: 60px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
}

.sign {
    text-align: center;
}

.sign-line {
    width: 160px;
    border-top: 2px solid #000;
    margin-bottom: 5px;
}

.date {
    margin-top: 30px;
    font-size: 14px;
    color: #333;
}
</style>
</head>

<body>

<div class="certificate">
    <div class="inner-border">

        <div class="logo">INNOSPHERE</div>
        <div class="subtitle">Innovation & Technology Forum</div>

        <div class="title">Certificate of Participation</div>

        <div class="presented">
            This certificate is proudly presented to
        </div>

        <div class="name">{{ NAME }}</div>

        <div class="details">
            of <strong>{{ DEPARTMENT }}</strong> department<br>
            from <strong>{{ COLLEGE }}</strong><br>
            for actively participating in the event
        </div>

        <div class="event">{{ EVENT }}</div>

        <div class="date">
            Awarded on {{ DATE }}
        </div>

    </div>

    <div class="footer">
        <div class="sign">
            <div class="sign-line"></div>
            <div>Event Coordinator</div>
        </div>

        <div class="sign">
            <div class="sign-line"></div>
            <div>Head, InnoSphere</div>
        </div>
    </div>

</div>

</body>
</html>
