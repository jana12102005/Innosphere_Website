{% extends "admin/baseadmin.html" %}
{% block title %}Events Management{% endblock %}

{% block content %}
<h2>Events Management</h2>

<div class="card">
    <h3>Add New Event</h3>

    <form method="POST" enctype="multipart/form-data">
        <label>Event Title</label>
        <input name="title" required>

        <label>Description</label>
        <textarea name="description"></textarea>

        <label>Brochure (Image/PDF)</label>
        <input type="file" name="brochure">

        <h4>Dynamic Form Fields</h4>
        <div id="dynamic-fields"></div>

        <button type="button" id="add-field-btn" class="btn btn-secondary">
            Add Input Field
        </button>

        <br><br>
        <button class="btn btn-primary">Create Event</button>
    </form>
</div>

<div class="card" style="color: black;">
    <h3>Existing Events</h3>

    <table>
        <tr>
            <th>Title</th>
            <th>Actions</th>
        </tr>

        {% for e in events %}
        <tr>
            <td>{{ e.title }}</td>
            <td>
                <form method="POST">
                    <input type="hidden" name="delete_id" value="{{ e.id }}">
                    <button class="btn btn-danger delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
