<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InnoSphere{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <img src="{{ url_for('static', filename='images/innosphere_logo.jpeg') }}" alt="InnoSphere" class="nav-logo">
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="{{ url_for('team.public_team') }}">Team</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><a href="/events">Events</a></li>
            <li><a href="/join">Join Us</a></li>
            <li><a href="/certificate">Certificate</a></li>
            <li><a href="{{ url_for('gallery.public_gallery') }}">Gallery</a></li>
            <li><a href="{{ url_for('team.public_members') }}">Members</a></li>
            <li><a href="{{ url_for('chatbot.chat_page') }}">Chat with Inno</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
        <img src="{{ url_for('static', filename='images/paavai_logo.png') }}" alt="Paavai Logo" class="nav-logo">
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<div class="footer">
    © InnoSphere Club | Paavai Innovation Forum
</div>

</body>
</html>
